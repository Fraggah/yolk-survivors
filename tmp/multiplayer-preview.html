&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };

      postToHost(&quot;follow-up&quot;, { context, prompt, title });

   * @returns {Promise&lt;void&gt;}

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#yolk-coop-2 .game{--paper:#f2e5c9;--ink:#483725;--line:#80674d;--tile:#fff7e6;--button:#ddcaa5;--selected:#bde0e3;--p1:#16778b;--p2:#ae4d53;--p3:#4967a4;--p4:#936719;--good:#2e7650;background:var(--paper);color:var(--ink);font:16px CoopBake2,system-ui;padding:20px;box-sizing:border-box;min-height:590px;display:flex;flex-direction:column;gap:18px}
#yolk-coop-2 .top{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px}
#yolk-coop-2 .game h2{font:28px CoopBake2,system-ui;text-align:center;margin:0}
#yolk-coop-2 .game h3{font:18px CoopBake2,system-ui;margin:0}
#yolk-coop-2 .game button{font-family:CoopBake2,system-ui;color:var(--ink);cursor:inherit}
#yolk-coop-2 .control{border:1.5px solid var(--line);border-radius:10px;background:var(--button);padding:7px 12px;font-size:15px}
#yolk-coop-2 .control:disabled{opacity:.45}
#yolk-coop-2 .control[aria-pressed=true],#yolk-coop-2 .lock.on{background:var(--ink);color:var(--tile)}
#yolk-coop-2 .person-pick{display:grid;grid-template-columns:33% 28% 33%;justify-content:space-between;align-items:center;gap:12px;flex:1}
#yolk-coop-2 .roster{display:grid;gap:9px;grid-template-columns:repeat(3,minmax(0,1fr));min-width:0}
#yolk-coop-2 .roster.weapons{grid-template-columns:repeat(8,minmax(0,1fr));gap:7px}
#yolk-coop-2 .slot{aspect-ratio:1;background:var(--tile);border:1.5px solid var(--line);border-radius:10px;position:relative;padding:4px;min-width:0}
#yolk-coop-2 .slot img{width:100%;height:100%;object-fit:contain;display:block}
#yolk-coop-2 .slot.future{opacity:.45;background:var(--button);font-size:18px}
#yolk-coop-2 .markers{position:absolute;bottom:2px;left:2px;display:flex;gap:2px;flex-wrap:wrap}
#yolk-coop-2 .tag{border-radius:5px;padding:2px 5px;background:var(--identity);color:#fff7e6;font:12px CoopBake2,system-ui;display:inline-block}
#yolk-coop-2 .stack{display:grid;grid-template-rows:repeat(4,1fr);gap:10px;min-width:0;align-self:stretch}
#yolk-coop-2 .seat{background:var(--tile);border:1.5px solid var(--line);border-radius:13px;padding:9px;display:grid;grid-template-columns:54px minmax(0,1fr);gap:7px;align-content:center;min-width:0;text-align:left}
#yolk-coop-2 .seat img{width:54px;height:54px;object-fit:contain;grid-row:span 2;align-self:center}
#yolk-coop-2 .seat[aria-pressed=true]{outline:3px solid var(--identity);outline-offset:1px}
#yolk-coop-2 .seat small{font:11px/1.3 system-ui;grid-column:2}
#yolk-coop-2 .seat .name{font-size:15px;overflow-wrap:anywhere}
#yolk-coop-2 .seat .name .tag{margin-right:4px}
#yolk-coop-2 .weapon-pick{display:grid;grid-template-columns:21% 21% 55%;justify-content:space-between;align-items:stretch;gap:0;flex:1;padding:42px 0}
#yolk-coop-2 .weapon-pick .seat{grid-template-columns:42px minmax(0,1fr);padding:7px;gap:5px}
#yolk-coop-2 .weapon-pick .seat img{width:42px;height:48px}
#yolk-coop-2 .weapon-pick .seat .name{font-size:14px}

t;&lt;h3&gt;ÍTEMS&lt;/h3&gt;&lt;div class=&quot;inventory&quot;&gt;${ownedPassives[i].map((item,j)=&gt;`&lt;button type=&quot;button&quot; class=&quot;passive-slot cursor-interaction&quot; data-passive=&quot;${j}&quot; aria-label=&quot;${item.name}, ${item.count} copias. Ver detalle&quot;&gt;&lt;img src=&quot;${item.src}&quot; alt=&quot;&quot;&gt;&lt;span&gt;×${item.count}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;footer class=&quot;quad-foot&quot;&gt;&lt;button class=&quot;control stats&quot;&gt;STATS / ITEMS&lt;/button&gt;&lt;button class=&quot;control reroll&quot; ${p.shopReady||p.coins&lt;2+p.rerolls?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;REFRESH ${2+p.rerolls}&lt;/button&gt;&lt;button class=&quot;control ready&quot; aria-pressed=&quot;${p.shopReady}&quot;&gt;${p.shopReady?&#x27;READY ✓&#x27;:&#x27;READY&#x27;}&lt;/button&gt;&lt;/footer&gt;&lt;div class=&quot;hint&quot; aria-live=&quot;polite&quot;&gt;${p.shopReady?&#x27;Esperando a los demás jugadores&#x27;:&#x27;Ofertas y saldo personales&#x27;}&lt;/div&gt;`;
q.querySelectorAll(&#x27;[data-passive]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const item=ownedPassives[i][Number(b.dataset.passive)];const panel=document.createElement(&#x27;div&#x27;);panel.className=&#x27;stats-overlay passive-detail&#x27;;panel.innerHTML=`&lt;h3&gt;${tag(i)} ${item.name} ×${item.count}&lt;/h3&gt;&lt;img src=&quot;${item.src}&quot; alt=&quot;&quot;&gt;&lt;p&gt;${item.effect}&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;control&quot;&gt;VOLVER&lt;/button&gt;`;panel.querySelector(&#x27;button&#x27;).onclick=()=&gt;panel.remove();q.appendChild(panel);panel.querySelector(&#x27;button&#x27;).focus();});
q.querySelectorAll(&#x27;[data-buy]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const o=offers[i][Number(b.dataset.buy)];if(p.coins&gt;=o.price&amp;&amp;!o.bought){p.coins-=o.price;o.bought=true;if(o.asset.id===&#x27;power_ball&#x27;||o.asset.id===&#x27;doble_yema&#x27;){const item=ownedPassives[i].find(a=&gt;a.id===o.asset.id);if(item)item.count++;else ownedPassives[i].push({...passiveCatalogue.find(a=&gt;a.id===o.asset.id),count:1});}renderShop();}});
q.querySelectorAll(&#x27;[data-lock]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const o=offers[i][Number(b.dataset.lock)];o.locked=!o.locked;renderShop();});
q.querySelector(&#x27;.ready&#x27;).onclick=()=&gt;{p.shopReady=!p.shopReady;renderShop();};q.querySelector(&#x27;.stats&#x27;).onclick=()=&gt;overlay(q,i);
q.querySelector(&#x27;.reroll&#x27;).onclick=()=&gt;{const cost=2+p.rerolls;if(p.coins&lt;cost)return;p.coins-=cost;p.rerolls++;offers[i].forEach((o,j)=&gt;{if(!o.locked){if(j&lt;2)o.asset=get(assets.weapons,shopPools[i][(j+p.rerolls)%4]);o.bought=false;}});renderShop();};grid.appendChild(q);});
const ready=party.filter(p=&gt;p.shopReady).length;root.querySelector(&#x27;[data-shop-status]&#x27;).textContent=`${ready} / ${COUNT} listos · cada mando controla su panel`;root.querySelector(&#x27;[data-next-wave]&#x27;).disabled=ready!==COUNT;
}
const upgradeOrders=party.map(()=&gt;[0,1,2,3]);
const improvements=[[&#x27;DAMAGE&#x27;,&#x27;+5%&#x27;,&#x27;8 damage&#x27;],[&#x27;HEALTH&#x27;,&#x27;+3&#x27;,&#x27;38 → 41 HP&#x27;],[&#x27;SPEED&#x27;,&#x27;+5&#x27;,&#x27;300 → 305&#x27;],[&#x27;ATTACK SPEED&#x27;,&#x27;+5%&#x27;,&#x27;15% → 20%&#x27;]];
function renderUpgrades(){const grid=root.querySelector(&#x27;[data-upgrades]&#x27;);grid.innerHTML=&#x27;&#x27;;party.forEach((p,i)=&gt;{const q=document.createElement(&#x27;section&#x27;);q.className=&#x27;quad&#x27;;q.setAttribute(&#x27;aria-label&#x27;,`Mejoras del jugador ${i+1}`);q.innerHTML=head(i,`&lt;span class=&quot;hint&quot;&gt;LV ${p.level}&lt;/span&gt;`)+(p.pending?`&lt;div class=&quot;offers&quot;&gt;${upgradeOrders[i].map((index,j)=&gt;{const s=improvements[index];return `&lt;div class=&quot;offer&quot; style=&quot;--rarity:${tiers[j===2?1:0][1]}&quot;&gt;&lt;div class=&quot;rarity&quot;&gt;${tiers[j===2?1:0][0]}&lt;/div&gt;&lt;div class=&quot;offer-body&quot;&gt;&lt;img src=&quot;${assets.upgrades[index]}&quot; alt=&quot;&quot;&gt;&lt;div class=&quot;label&quot;&gt;${s[0]}&lt;/div&gt;&lt;div class=&quot;effect&quot;&gt;${s[1]}&lt;/div&gt;&lt;button class=&quot;control choose&quot; data-choice=&quot;${j}&quot;&gt;SELECT&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;`:`&lt;div class=&quot;completed&quot;&gt;✓ UPGRADES COMPLETE&lt;/div&gt;`)+`&lt;footer class=&quot;quad-foot&quot;&gt;&lt;button class=&quot;control stats&quot;&gt;STATS&lt;/button&gt;&lt;span class=&quot;hint&quot;&gt;${p.pending?`${p.pending} mejora${p.pending&gt;1?&#x27;s&#x27;:&#x27;&#x27;} pendiente${p.pending&gt;1?&#x27;s&#x27;:&#x27;&#x27;}`:&#x27;Esperando a los demás&#x27;}&lt;/span&gt;&lt;button class=&quot;control reroll&quot; ${p.pending&amp;&amp;p.coins&gt;=2?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;REFRESH 2&lt;/button&gt;&lt;/footer&gt;`;
q.querySelectorAll(&#x27;[data-choice]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{p.pending--;p.level++;renderUpgrades();});q.querySelector(&#x27;.stats&#x27;).onclick=()=&gt;overlay(q,i);q.querySelector(&#x27;.reroll&#x27;).onclick=()=&gt;{if(p.coins&lt;2)return;p.coins-=2;const first=upgradeOrders[i].shift();upgradeOrders[i].push(first);renderUpgrades();};grid.appendChild(q);});const done=party.filter(p=&gt;!p.pending).length;root.querySelector(&#x27;[data-upgrade-status]&#x27;).textContent=`${done} / ${COUNT} terminaron sus mejoras · cada uno procesa sus niveles`;root.querySelector(&#x27;[data-to-shop]&#x27;).disabled=done!==COUNT;}
root.querySelector(&#x27;[data-go-weapons]&#x27;).onclick=()=&gt;tab(&#x27;weapons&#x27;);root.querySelector(&#x27;[data-go-characters]&#x27;).onclick=()=&gt;tab(&#x27;chars&#x27;);root.querySelector(&#x27;[data-to-shop]&#x27;).onclick=()=&gt;{renderShop();tab(&#x27;shop&#x27;);};root.querySelector(&#x27;[data-next-wave]&#x27;).onclick=()=&gt;{root.querySelector(&#x27;[data-shop-status]&#x27;).textContent=&#x27;¡Todos listos! Comenzaría la oleada 7.&#x27;;};
renderParty();renderShop();renderUpgrades();
if(globalThis.Tweak){const design={spacing:14};const tweak=new Tweak({container:root,onChange:()=&gt;{root.querySelectorAll(&#x27;.quad-grid&#x27;).forEach(g=&gt;g.style.gap=design.spacing+&#x27;px&#x27;);}});tweak.addSlider(design,&#x27;spacing&#x27;,{label:&#x27;Separación de paneles&#x27;,min:8,max:24,unit:&#x27;px&#x27;});}

})();

#yolk-coop-3 .game{--paper:#f2e5c9;--ink:#483725;--line:#80674d;--tile:#fff7e6;--button:#ddcaa5;--selected:#bde0e3;--p1:#16778b;--p2:#ae4d53;--p3:#4967a4;--p4:#936719;--good:#2e7650;background:var(--paper);color:var(--ink);font:16px CoopBake3,system-ui;padding:20px;box-sizing:border-box;min-height:590px;display:flex;flex-direction:column;gap:18px}
#yolk-coop-3 .top{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px}
#yolk-coop-3 .game h2{font:28px CoopBake3,system-ui;text-align:center;margin:0}
#yolk-coop-3 .game h3{font:18px CoopBake3,system-ui;margin:0}
#yolk-coop-3 .game button{font-family:CoopBake3,system-ui;color:var(--ink);cursor:inherit}
#yolk-coop-3 .control{border:1.5px solid var(--line);border-radius:10px;background:var(--button);padding:7px 12px;font-size:15px}
#yolk-coop-3 .control:disabled{opacity:.45}
#yolk-coop-3 .control[aria-pressed=true],#yolk-coop-3 .lock.on{background:var(--ink);color:var(--tile)}
#yolk-coop-3 .person-pick{display:grid;grid-template-columns:33% 28% 33%;justify-content:space-between;align-items:center;gap:12px;flex:1}
#yolk-coop-3 .roster{display:grid;gap:9px;grid-template-columns:repeat(3,minmax(0,1fr));min-width:0}
#yolk-coop-3 .roster.weapons{grid-template-columns:repeat(8,minmax(0,1fr));gap:7px}
#yolk-coop-3 .slot{aspect-ratio:1;background:var(--tile);border:1.5px solid var(--line);border-radius:10px;position:relative;padding:4px;min-width:0}
#yolk-coop-3 .slot img{width:100%;height:100%;object-fit:contain;display:block}
#yolk-coop-3 .slot.future{opacity:.45;background:var(--button);font-size:18px}
#yolk-coop-3 .markers{position:absolute;bottom:2px;left:2px;display:flex;gap:2px;flex-wrap:wrap}
#yolk-coop-3 .tag{border-radius:5px;padding:2px 5px;background:var(--identity);color:#fff7e6;font:12px CoopBake3,system-ui;display:inline-block}
#yolk-coop-3 .stack{display:grid;grid-template-rows:repeat(4,1fr);gap:10px;min-width:0;align-self:stretch}
#yolk-coop-3 .seat{background:var(--tile);border:1.5px solid var(--line);border-radius:13px;padding:9px;display:grid;grid-template-columns:54px minmax(0,1fr);gap:7px;align-content:center;min-width:0;text-align:left}
#yolk-coop-3 .seat img{width:54px;height:54px;object-fit:contain;grid-row:span 2;align-self:center}
#yolk-coop-3 .seat[aria-pressed=true]{outline:3px solid var(--identity);outline-offset:1px}
#yolk-coop-3 .seat small{font:11px/1.3 system-ui;grid-column:2}
#yolk-coop-3 .seat .name{font-size:15px;overflow-wrap:anywhere}
#yolk-coop-3 .seat .name .tag{margin-right:4px}
#yolk-coop-3 .weapon-pick{display:grid;grid-template-columns:21% 21% 55%;justify-content:space-between;align-items:stretch;gap:0;flex:1;padding:42px 0}
#yolk-coop-3 .weapon-pick .seat{grid-template-columns:42px minmax(0,1fr);padding:7px;gap:5px}
#yolk-coop-3 .weapon-pick .seat img{width:42px;height:48px}
#yolk-coop-3 .weapon-pick .seat .name{font-size:14px}

t;&lt;h3&gt;ÍTEMS&lt;/h3&gt;&lt;div class=&quot;inventory&quot;&gt;${ownedPassives[i].map((item,j)=&gt;`&lt;button type=&quot;button&quot; class=&quot;passive-slot cursor-interaction&quot; data-passive=&quot;${j}&quot; aria-label=&quot;${item.name}, ${item.count} copias. Ver detalle&quot;&gt;&lt;img src=&quot;${item.src}&quot; alt=&quot;&quot;&gt;&lt;span&gt;×${item.count}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;footer class=&quot;quad-foot&quot;&gt;&lt;button class=&quot;control stats&quot;&gt;STATS / ITEMS&lt;/button&gt;&lt;button class=&quot;control reroll&quot; ${p.shopReady||p.coins&lt;2+p.rerolls?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;REFRESH ${2+p.rerolls}&lt;/button&gt;&lt;button class=&quot;control ready&quot; aria-pressed=&quot;${p.shopReady}&quot;&gt;${p.shopReady?&#x27;READY ✓&#x27;:&#x27;READY&#x27;}&lt;/button&gt;&lt;/footer&gt;&lt;div class=&quot;hint&quot; aria-live=&quot;polite&quot;&gt;${p.shopReady?&#x27;Esperando a los demás jugadores&#x27;:&#x27;Ofertas y saldo personales&#x27;}&lt;/div&gt;`;
q.querySelectorAll(&#x27;[data-passive]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const item=ownedPassives[i][Number(b.dataset.passive)];const panel=document.createElement(&#x27;div&#x27;);panel.className=&#x27;stats-overlay passive-detail&#x27;;panel.innerHTML=`&lt;h3&gt;${tag(i)} ${item.name} ×${item.count}&lt;/h3&gt;&lt;img src=&quot;${item.src}&quot; alt=&quot;&quot;&gt;&lt;p&gt;${item.effect}&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;control&quot;&gt;VOLVER&lt;/button&gt;`;panel.querySelector(&#x27;button&#x27;).onclick=()=&gt;panel.remove();q.appendChild(panel);panel.querySelector(&#x27;button&#x27;).focus();});
q.querySelectorAll(&#x27;[data-buy]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const o=offers[i][Number(b.dataset.buy)];if(p.coins&gt;=o.price&amp;&amp;!o.bought){p.coins-=o.price;o.bought=true;if(o.asset.id===&#x27;power_ball&#x27;||o.asset.id===&#x27;doble_yema&#x27;){const item=ownedPassives[i].find(a=&gt;a.id===o.asset.id);if(item)item.count++;else ownedPassives[i].push({...passiveCatalogue.find(a=&gt;a.id===o.asset.id),count:1});}renderShop();}});
q.querySelectorAll(&#x27;[data-lock]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const o=offers[i][Number(b.dataset.lock)];o.locked=!o.locked;renderShop();});
q.querySelector(&#x27;.ready&#x27;).onclick=()=&gt;{p.shopReady=!p.shopReady;renderShop();};q.querySelector(&#x27;.stats&#x27;).onclick=()=&gt;overlay(q,i);
q.querySelector(&#x27;.reroll&#x27;).onclick=()=&gt;{const cost=2+p.rerolls;if(p.coins&lt;cost)return;p.coins-=cost;p.rerolls++;offers[i].forEach((o,j)=&gt;{if(!o.locked){if(j&lt;2)o.asset=get(assets.weapons,shopPools[i][(j+p.rerolls)%4]);o.bought=false;}});renderShop();};grid.appendChild(q);});
const ready=party.filter(p=&gt;p.shopReady).length;root.querySelector(&#x27;[data-shop-status]&#x27;).textContent=`${ready} / ${COUNT} listos · cada mando controla su panel`;root.querySelector(&#x27;[data-next-wave]&#x27;).disabled=ready!==COUNT;
}
const upgradeOrders=party.map(()=&gt;[0,1,2,3]);
const improvements=[[&#x27;DAMAGE&#x27;,&#x27;+5%&#x27;,&#x27;8 damage&#x27;],[&#x27;HEALTH&#x27;,&#x27;+3&#x27;,&#x27;38 → 41 HP&#x27;],[&#x27;SPEED&#x27;,&#x27;+5&#x27;,&#x27;300 → 305&#x27;],[&#x27;ATTACK SPEED&#x27;,&#x27;+5%&#x27;,&#x27;15% → 20%&#x27;]];
function renderUpgrades(){const grid=root.querySelector(&#x27;[data-upgrades]&#x27;);grid.innerHTML=&#x27;&#x27;;party.forEach((p,i)=&gt;{const q=document.createElement(&#x27;section&#x27;);q.className=&#x27;quad&#x27;;q.setAttribute(&#x27;aria-label&#x27;,`Mejoras del jugador ${i+1}`);q.innerHTML=head(i,`&lt;span class=&quot;hint&quot;&gt;LV ${p.level}&lt;/span&gt;`)+(p.pending?`&lt;div class=&quot;offers&quot;&gt;${upgradeOrders[i].map((index,j)=&gt;{const s=improvements[index];return `&lt;div class=&quot;offer&quot; style=&quot;--rarity:${tiers[j===2?1:0][1]}&quot;&gt;&lt;div class=&quot;rarity&quot;&gt;${tiers[j===2?1:0][0]}&lt;/div&gt;&lt;div class=&quot;offer-body&quot;&gt;&lt;img src=&quot;${assets.upgrades[index]}&quot; alt=&quot;&quot;&gt;&lt;div class=&quot;label&quot;&gt;${s[0]}&lt;/div&gt;&lt;div class=&quot;effect&quot;&gt;${s[1]}&lt;/div&gt;&lt;button class=&quot;control choose&quot; data-choice=&quot;${j}&quot;&gt;SELECT&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;`:`&lt;div class=&quot;completed&quot;&gt;✓ UPGRADES COMPLETE&lt;/div&gt;`)+`&lt;footer class=&quot;quad-foot&quot;&gt;&lt;button class=&quot;control stats&quot;&gt;STATS&lt;/button&gt;&lt;span class=&quot;hint&quot;&gt;${p.pending?`${p.pending} mejora${p.pending&gt;1?&#x27;s&#x27;:&#x27;&#x27;} pendiente${p.pending&gt;1?&#x27;s&#x27;:&#x27;&#x27;}`:&#x27;Esperando a los demás&#x27;}&lt;/span&gt;&lt;button class=&quot;control reroll&quot; ${p.pending&amp;&amp;p.coins&gt;=2?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;REFRESH 2&lt;/button&gt;&lt;/footer&gt;`;
q.querySelectorAll(&#x27;[data-choice]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{p.pending--;p.level++;renderUpgrades();});q.querySelector(&#x27;.stats&#x27;).onclick=()=&gt;overlay(q,i);q.querySelector(&#x27;.reroll&#x27;).onclick=()=&gt;{if(p.coins&lt;2)return;p.coins-=2;const first=upgradeOrders[i].shift();upgradeOrders[i].push(first);renderUpgrades();};grid.appendChild(q);});const done=party.filter(p=&gt;!p.pending).length;root.querySelector(&#x27;[data-upgrade-status]&#x27;).textContent=`${done} / ${COUNT} terminaron sus mejoras · cada uno procesa sus niveles`;root.querySelector(&#x27;[data-to-shop]&#x27;).disabled=done!==COUNT;}
root.querySelector(&#x27;[data-go-weapons]&#x27;).onclick=()=&gt;tab(&#x27;weapons&#x27;);root.querySelector(&#x27;[data-go-characters]&#x27;).onclick=()=&gt;tab(&#x27;chars&#x27;);root.querySelector(&#x27;[data-to-shop]&#x27;).onclick=()=&gt;{renderShop();tab(&#x27;shop&#x27;);};root.querySelector(&#x27;[data-next-wave]&#x27;).onclick=()=&gt;{root.querySelector(&#x27;[data-shop-status]&#x27;).textContent=&#x27;¡Todos listos! Comenzaría la oleada 7.&#x27;;};
renderParty();renderShop();renderUpgrades();
if(globalThis.Tweak){const design={spacing:14};const tweak=new Tweak({container:root,onChange:()=&gt;{root.querySelectorAll(&#x27;.quad-grid&#x27;).forEach(g=&gt;g.style.gap=design.spacing+&#x27;px&#x27;);}});tweak.addSlider(design,&#x27;spacing&#x27;,{label:&#x27;Separación de paneles&#x27;,min:8,max:24,unit:&#x27;px&#x27;});}

})();

#yolk-coop-4 .game{--paper:#f2e5c9;--ink:#483725;--line:#80674d;--tile:#fff7e6;--button:#ddcaa5;--selected:#bde0e3;--p1:#16778b;--p2:#ae4d53;--p3:#4967a4;--p4:#936719;--good:#2e7650;background:var(--paper);color:var(--ink);font:16px CoopBake4,system-ui;padding:20px;box-sizing:border-box;min-height:590px;display:flex;flex-direction:column;gap:18px}
#yolk-coop-4 .top{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px}
#yolk-coop-4 .game h2{font:28px CoopBake4,system-ui;text-align:center;margin:0}
#yolk-coop-4 .game h3{font:18px CoopBake4,system-ui;margin:0}
#yolk-coop-4 .game button{font-family:CoopBake4,system-ui;color:var(--ink);cursor:inherit}
#yolk-coop-4 .control{border:1.5px solid var(--line);border-radius:10px;background:var(--button);padding:7px 12px;font-size:15px}
#yolk-coop-4 .control:disabled{opacity:.45}
#yolk-coop-4 .control[aria-pressed=true],#yolk-coop-4 .lock.on{background:var(--ink);color:var(--tile)}
#yolk-coop-4 .person-pick{display:grid;grid-template-columns:33% 28% 33%;justify-content:space-between;align-items:center;gap:12px;flex:1}
#yolk-coop-4 .roster{display:grid;gap:9px;grid-template-columns:repeat(3,minmax(0,1fr));min-width:0}
#yolk-coop-4 .roster.weapons{grid-template-columns:repeat(8,minmax(0,1fr));gap:7px}
#yolk-coop-4 .slot{aspect-ratio:1;background:var(--tile);border:1.5px solid var(--line);border-radius:10px;position:relative;padding:4px;min-width:0}
#yolk-coop-4 .slot img{width:100%;height:100%;object-fit:contain;display:block}
#yolk-coop-4 .slot.future{opacity:.45;background:var(--button);font-size:18px}
#yolk-coop-4 .markers{position:absolute;bottom:2px;left:2px;display:flex;gap:2px;flex-wrap:wrap}
#yolk-coop-4 .tag{border-radius:5px;padding:2px 5px;background:var(--identity);color:#fff7e6;font:12px CoopBake4,system-ui;display:inline-block}
#yolk-coop-4 .stack{display:grid;grid-template-rows:repeat(4,1fr);gap:10px;min-width:0;align-self:stretch}
#yolk-coop-4 .seat{background:var(--tile);border:1.5px solid var(--line);border-radius:13px;padding:9px;display:grid;grid-template-columns:54px minmax(0,1fr);gap:7px;align-content:center;min-width:0;text-align:left}
#yolk-coop-4 .seat img{width:54px;height:54px;object-fit:contain;grid-row:span 2;align-self:center}
#yolk-coop-4 .seat[aria-pressed=true]{outline:3px solid var(--identity);outline-offset:1px}
#yolk-coop-4 .seat small{font:11px/1.3 system-ui;grid-column:2}
#yolk-coop-4 .seat .name{font-size:15px;overflow-wrap:anywhere}
#yolk-coop-4 .seat .name .tag{margin-right:4px}
#yolk-coop-4 .weapon-pick{display:grid;grid-template-columns:21% 21% 55%;justify-content:space-between;align-items:stretch;gap:0;flex:1;padding:42px 0}
#yolk-coop-4 .weapon-pick .seat{grid-template-columns:42px minmax(0,1fr);padding:7px;gap:5px}
#yolk-coop-4 .weapon-pick .seat img{width:42px;height:48px}
#yolk-coop-4 .weapon-pick .seat .name{font-size:14px}
